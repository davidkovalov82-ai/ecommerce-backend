name: commerce

services:
  db:
    image: postgres:17-alpine
    container_name: commerce-db
    restart: unless-stopped
    environment:
      # В съществуващ volume bootstrap админ ролята може да е 'commerce' (не се изисква изтриване на volume)
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-commerce}
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-commerce} -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-init:
    image: postgres:17-alpine
    container_name: commerce-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-commerce}
      POSTGRES_DB: commerce
      COMMERCE_APP_USER: ${COMMERCE_DB_USER:-commerce_app}
      COMMERCE_APP_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce_app}
      COMMERCE_DB_NAME: commerce
      NOTIF_APP_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      NOTIF_APP_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      NOTIF_DB_NAME: notifications
      PAYMENTS_APP_USER: ${PAYMENTS_DB_USER:-payments}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      PAYMENTS_DB_NAME: payments
      USERS_APP_USER: ${USERS_DB_USER:-users}
      USERS_APP_PASSWORD: ${USERS_DB_PASSWORD:-users}
      USERS_DB_NAME: users
      CATALOG_APP_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_APP_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      CATALOG_DB_NAME: catalog
      CART_APP_USER: ${CART_DB_USER:-cart}
      CART_APP_PASSWORD: ${CART_DB_PASSWORD:-cart}
      CART_DB_NAME: cart
    restart: "no"
    volumes:
      - ./scripts/postgres_db_init.sh:/usr/local/bin/postgres_db_init.sh:ro
    command: ["sh", "/usr/local/bin/postgres_db_init.sh"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: commerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: commerce-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    container_name: commerce-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      users:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      orders:
        condition: service_healthy

  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: orders-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      users:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${ORDERS_DB_USER:-${COMMERCE_DB_USER:-commerce_app}}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-${COMMERCE_DB_PASSWORD:-commerce_app}}
      DB_NAME: ${ORDERS_DB_NAME:-${COMMERCE_DB_NAME:-commerce}}
      JWT_SECRET: ${JWT_SECRET:-1e3c0d99b3b5c2e6afb5bf73554df714af33884490bceb1eb7d2b9ed3c309ce7}
      USERS_BASE_URL: ${USERS_BASE_URL:-http://users:8002}
      USERS_INTERNAL_AUTH_TOKEN: ${USERS_INTERNAL_AUTH_TOKEN:-ecommerce-users-internal-secret}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-http://catalog:8003}
      CATALOG_INTERNAL_AUTH_TOKEN: ${CATALOG_INTERNAL_AUTH_TOKEN:-ecommerce-catalog-internal-secret}
      CART_BASE_URL: ${CART_BASE_URL:-http://cart:8004}
      CART_INTERNAL_AUTH_TOKEN: ${CART_INTERNAL_AUTH_TOKEN:-ecommerce-cart-internal-secret}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments:8001}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:-k5-internal-payments-token-32b-ok!}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    ports:
      - "8005:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-outbox:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: orders-outbox
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      orders:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${ORDERS_DB_USER:-${COMMERCE_DB_USER:-commerce_app}}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-${COMMERCE_DB_PASSWORD:-commerce_app}}
      DB_NAME: ${ORDERS_DB_NAME:-${COMMERCE_DB_NAME:-commerce}}
      JWT_SECRET: ${JWT_SECRET:-1e3c0d99b3b5c2e6afb5bf73554df714af33884490bceb1eb7d2b9ed3c309ce7}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:-k5-internal-payments-token-32b-ok!}
      CART_BASE_URL: ${CART_BASE_URL:-http://cart:8004}
      CART_INTERNAL_AUTH_TOKEN: ${CART_INTERNAL_AUTH_TOKEN:-ecommerce-cart-internal-secret}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/process_outbox.py --daemon --poll-interval 1.0"

  orders-payment-consumer:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: orders-payment-consumer
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      orders:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${ORDERS_DB_USER:-${COMMERCE_DB_USER:-commerce_app}}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-${COMMERCE_DB_PASSWORD:-commerce_app}}
      DB_NAME: ${ORDERS_DB_NAME:-${COMMERCE_DB_NAME:-commerce}}
      JWT_SECRET: ${JWT_SECRET:-1e3c0d99b3b5c2e6afb5bf73554df714af33884490bceb1eb7d2b9ed3c309ce7}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments:8001}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:-k5-internal-payments-token-32b-ok!}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/consume_payment_events.py --daemon"

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: payments-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DB_NAME: payments
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:-k5-internal-payments-token-32b-ok!}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8000/orders/{order_id}?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8000/orders/{order_id}?payment=cancelled}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8001:8001"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  payments-outbox:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: payments-outbox
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      payments:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DB_NAME: payments
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:-k5-internal-payments-token-32b-ok!}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/process_outbox.py --daemon --poll-interval 1.0"

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notifications-worker
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      DB_NAME: notifications
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMS_MODE: ${SMS_MODE:-test}
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-}
    command: sh -c "alembic upgrade head && python -m app.main"

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: users-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${USERS_DB_USER:-users}
      DB_PASSWORD: ${USERS_DB_PASSWORD:-users}
      DB_NAME: users
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      INTERNAL_AUTH_TOKEN: ${USERS_INTERNAL_AUTH_TOKEN:-ecommerce-users-internal-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8002:8002"
    volumes:
      - ./services/users/jwt_private.pem:/app/jwt_private.pem:ro
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: catalog-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${CATALOG_DB_USER:-catalog}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      DB_NAME: catalog
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      INTERNAL_AUTH_TOKEN: ${CATALOG_INTERNAL_AUTH_TOKEN:-ecommerce-catalog-internal-secret}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8003:8003"
    volumes:
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8003"

  catalog-user-consumer:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: catalog-user-consumer
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${CATALOG_DB_USER:-catalog}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      DB_NAME: catalog
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/consume_user_events.py --daemon"

  users-outbox:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: users-outbox
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      users:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${USERS_DB_USER:-users}
      DB_PASSWORD: ${USERS_DB_PASSWORD:-users}
      DB_NAME: users
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/process_outbox.py --daemon --poll-interval 1.0"

  cart:
    build:
      context: ./services/cart
      dockerfile: Dockerfile
    container_name: cart-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${CART_DB_USER:-cart}
      DB_PASSWORD: ${CART_DB_PASSWORD:-cart}
      DB_NAME: cart
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      INTERNAL_AUTH_TOKEN: ${CART_INTERNAL_AUTH_TOKEN:-ecommerce-cart-internal-secret}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-http://catalog:8003}
      CATALOG_INTERNAL_AUTH_TOKEN: ${CATALOG_INTERNAL_AUTH_TOKEN:-ecommerce-catalog-internal-secret}
    ports:
      - "8004:8004"
    volumes:
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8004"

volumes:
  postgres_data:
  rabbitmq_data:
