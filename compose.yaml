name: commerce

services:
  db:
    image: postgres:17-alpine
    container_name: commerce-db
    restart: unless-stopped
    environment:
      # В съществуващ volume bootstrap админ ролята може да е 'commerce' (не се изисква изтриване на volume)
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-commerce}
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-commerce} -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-init:
    image: postgres:17-alpine
    container_name: commerce-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-commerce}
      POSTGRES_DB: commerce
      COMMERCE_APP_USER: ${COMMERCE_DB_USER:-commerce_app}
      COMMERCE_APP_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce_app}
      COMMERCE_DB_NAME: commerce
      NOTIF_APP_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      NOTIF_APP_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      NOTIF_DB_NAME: notifications
      PAYMENTS_APP_USER: ${PAYMENTS_DB_USER:-payments}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      PAYMENTS_DB_NAME: payments
      USERS_APP_USER: ${USERS_DB_USER:-users}
      USERS_APP_PASSWORD: ${USERS_DB_PASSWORD:-users}
      USERS_DB_NAME: users
    restart: "no"
    volumes:
      - ./scripts/postgres_db_init.sh:/usr/local/bin/postgres_db_init.sh:ro
    command: ["sh", "/usr/local/bin/postgres_db_init.sh"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: commerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: commerce-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/commerce
      dockerfile: Dockerfile
    container_name: commerce-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      users:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${COMMERCE_DB_USER:-commerce_app}
      DB_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce_app}
      DB_NAME: commerce
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and non-empty}
      USERS_BASE_URL: ${USERS_BASE_URL:-http://users:8002}
      USERS_INTERNAL_AUTH_TOKEN: ${USERS_INTERNAL_AUTH_TOKEN:-ecommerce-users-internal-secret}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments:8001}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:?PAYMENTS_INTERNAL_AUTH_TOKEN must be set and non-empty}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  commerce-outbox:
    build:
      context: ./services/commerce
      dockerfile: Dockerfile
    container_name: commerce-outbox
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${COMMERCE_DB_USER:-commerce_app}
      DB_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce_app}
      DB_NAME: commerce
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and non-empty}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:?PAYMENTS_INTERNAL_AUTH_TOKEN must be set and non-empty}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/process_outbox.py --daemon --poll-interval 1.0"

  commerce-payment-consumer:
    build:
      context: ./services/commerce
      dockerfile: Dockerfile
    container_name: commerce-payment-consumer
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${COMMERCE_DB_USER:-commerce_app}
      DB_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce_app}
      DB_NAME: commerce
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and non-empty}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments:8001}
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:?PAYMENTS_INTERNAL_AUTH_TOKEN must be set and non-empty}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/consume_payment_events.py --daemon"

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: payments-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DB_NAME: payments
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:?PAYMENTS_INTERNAL_AUTH_TOKEN must be set and non-empty}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8000/orders/{order_id}?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8000/orders/{order_id}?payment=cancelled}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8001:8001"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  payments-outbox:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: payments-outbox
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      payments:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DB_NAME: payments
      PAYMENTS_INTERNAL_AUTH_TOKEN: ${PAYMENTS_INTERNAL_AUTH_TOKEN:?PAYMENTS_INTERNAL_AUTH_TOKEN must be set and non-empty}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    command: sh -c "python scripts/process_outbox.py --daemon --poll-interval 1.0"

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notifications-worker
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      DB_NAME: notifications
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMS_MODE: ${SMS_MODE:-test}
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-}
    command: sh -c "alembic upgrade head && python -m app.main"

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: users-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${USERS_DB_USER:-users}
      DB_PASSWORD: ${USERS_DB_PASSWORD:-users}
      DB_NAME: users
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-jwt_public.pem}
      INTERNAL_AUTH_TOKEN: ${USERS_INTERNAL_AUTH_TOKEN:-ecommerce-users-internal-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
    ports:
      - "8002:8002"
    volumes:
      - ./services/users/jwt_private.pem:/app/jwt_private.pem:ro
      - ./services/users/jwt_public.pem:/app/jwt_public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"

volumes:
  postgres_data:
  rabbitmq_data:
