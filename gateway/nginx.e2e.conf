events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream users_e2e_upstream {
        server users-e2e:8002;
    }

    upstream catalog_e2e_upstream {
        server catalog-e2e:8003;
    }

    upstream cart_e2e_upstream {
        server cart-e2e:8004;
    }

    upstream orders_e2e_upstream {
        server orders-api-e2e:8000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx-e2e"}\n';
        }

        # 1. Приоритетен маршрут за каталога на продавача (започва с /users/me/products)
        location ^~ /users/me/products {
            proxy_pass http://catalog_e2e_upstream;
        }

        # 2. Домейн Users (/auth и потребителски профили)
        location /auth {
            proxy_pass http://users_e2e_upstream;
        }

        location /users {
            proxy_pass http://users_e2e_upstream;
        }

        # 3. Домейн Catalog (публични продукти и категории)
        location /products {
            proxy_pass http://catalog_e2e_upstream;
        }

        location /categories {
            proxy_pass http://catalog_e2e_upstream;
        }

        # 4. Домейн Cart (потребителска количка)
        location /cart {
            proxy_pass http://cart_e2e_upstream;
        }

        # 5. Домейн Orders (поръчки и пратки)
        location /orders {
            proxy_pass http://orders_e2e_upstream;
        }

        location /seller/shipments {
            proxy_pass http://orders_e2e_upstream;
        }
    }
}
