      DB_USER: notifications
      DB_PASSWORD: notifications_ci
      DB_NAME: notifications
      DB_ADMIN_USER: commerce
      DB_ADMIN_PASSWORD: commerce_ci
      DB_ADMIN_NAME: commerce
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: "noreply@example.com"
      MAILPIT_WEB_URL: "http://127.0.0.1:8025"
      RABBITMQ_HOST: 127.0.0.1
